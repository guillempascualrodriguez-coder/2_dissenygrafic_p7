<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Flex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://use.typekit.net/pjb5bak.css">
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root{
            --lima-color:#CCFF02;
            --storm-color:#8696A8;
            --violet-color:#E4D2FC;
            --chilli-color:#EF432B;
            --dark-color:#282625;
            --lightandbright-color:#EFEAE8;
            --forest-color:#325444;

        }

        .container{
            padding: 50px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr 1fr;
            height: 100vh;
            width: 100vw;
        }

        #lime{
            display: flex;
            flex-direction: column;
            gap: 25px;
            flex: 1;
            padding: 10px;
            grid-area: 1/1/2/2;
            background-color: #CCFF02;
            font-family: "afronaut", sans-serif;
            font-size: 70px;
            color: #315443;
        }

        #storm{
            display: flex;
            flex-direction: column;
            gap: 25px;
            flex: 1;
            padding: 10px;
            grid-area: 1/1/2/2;
            background-color: var(--storm-color);
            font-family: "afronaut", sans-serif;
            font-size: 55px;
            color: #f0ebe7;
        }

        #violet{
            display: flex;
            flex-direction: column;
            gap: 25px;
            flex: 1;
            padding: 10px;
            grid-area: 1/1/2/2;
            background-color: var(--violet-color);
            font-family: "afronaut", sans-serif;
            font-size: 52px;
            color: var(--chilli-color);

        }   

        #chilli{
            display: flex;
            flex-direction: column;
            gap: 25px;
            flex: 1;
            padding: 10px;
            grid-area: 1/1/2/2;
            background-color: var(--chilli-color);
            font-family: "afronaut", sans-serif;
            font-size: 55px;
            color: #f0ebe7;
        }

        #dark{
            flex: 1;  
            padding: 10px;
            flex: 1;
            background-color: var(--dark-color);
            font-family: "afronaut", sans-serif;
            font-size: 50px;
            color: #efeae7;

        }

        #lightandbright{
            padding: 10px;
            flex: 2;
            background-color: var(--lightandbright-color);
            font-family: "afronaut", sans-serif;
            font-size: 50px;
            color: #292824;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #forest{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            padding: 10px 45px 10px 10px;
            overflow: hidden;
            flex: 1;
            grid-area: 1/3/5/4;
            background-color: var(--forest-color);
            font-family: "afronaut", sans-serif;
            font-size: 80px;
            color: #efeae7;

        }

        .column1{
            display: flex;
            flex-direction: column;
            grid-row: 1/5;
        }

        .column2{
            display: flex;
            flex-direction: column;
            grid-row: 1/5;
        }

        .column3{
            display: flex;
            flex-direction: column;
            grid-row: 1/5;

        }

        #vertical{
            writing-mode: vertical-rl;
        }

        p{
            font-size: 15px;
            font-family: monospace;
        }

        h1{
            line-height: 100px;
        }

    </style>
</head>


<body>
    <div class="container">
        <div class="column1">
            <div id="lime">
                <p>#CCFF02</p>
                <h1>LIME</h1>
            </div>
            <div id="storm">
                <p>#8696A8</p>
                <h1>STORM</h1>
            </div>
            <div id="violet">
                <p>#E4D2FC</p>
                <h1>VIOLET</h1>
            </div>
            <div id="chilli">
                <p>#EF432B</p>
                <h1>CHILLI</h1>
            </div>
        </div> 
        
        <div class="column2">
            <div id="dark">
                <p>#282625</p>
                <h1>DARK</h1>
            </div>
            <div id="lightandbright">
                <p>#EFEAE8</p>
                <h1>LIGHT&<br>BRIGHT</h1>
            </div>
        </div>

        <div class="column3">
        <div id="forest">
            <p>#325444</p>
            <h1 id="vertical">FOREST</h1>
        </div>
        </div>
    </div>
    
</body>
</html>
